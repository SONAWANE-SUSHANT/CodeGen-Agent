<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Todo List App</h1>
    </header>
    <main>
        <section class="todo-list">
            <input type="text" id="search-bar" placeholder="Search tasks">
            <ul id="task-list"></ul>
            <button id="clear-completed">Clear Completed</button>
            <p id="total-tasks">Total tasks: 0</p>
            <button id="add-task">Add task</button>
            <div id="task-form" style="display: none;">
                <input type="text" id="task-input" placeholder="Enter task name">
                <button id="save-task">Save task</button>
                <button id="cancel-task">Cancel</button>
            </div>
            <div id="edit-task-form" style="display: none;">
                <input type="text" id="edit-task-input" placeholder="Enter task name">
                <button id="update-task">Update task</button>
                <button id="cancel-edit-task">Cancel</button>
            </div>
        </section>
        <section class="filters">
            <button id="all-filter" class="active">All</button>
            <button id="active-filter">Active</button>
            <button id="completed-filter">Completed</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
